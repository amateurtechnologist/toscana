name: Deploy to Oracle VM

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toscana-oracle-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, toscana]

    steps:
      - uses: actions/checkout@v4

      - name: Write configuration and start
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          test -n "$DISCORD_TOKEN"
          umask 077
          printf '%s\n' \
            "DISCORD_TOKEN=$DISCORD_TOKEN" \
            'CATEGORY_A_ID=1554077666573950986' \
            'CATEGORY_A_FORWARD_CHANNEL_ID=1560615321910386758' \
            'CATEGORY_B_ID=1554078902496792607' \
            'CATEGORY_B_FORWARD_CHANNEL_ID=1560615399547216042' \
            'TOSCANA_BLACKLIST_CHANNEL_IDS=' \
            'TOSCANA_BLACKLIST_GUILD_IDS=' > .env
          chmod 600 .env
          docker compose up -d --build
